<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi tiết Đại vận - Lịch Việt</title>
    <style>
        :root {
            --primary: #169172;
            --primary-dark: #0F6B54;
            --bg-light: #F5F7FA;
            --card-bg: #FFFFFF;
            --text-main: #1F1F1F;
            --text-secondary: #666666;
            --border-color: #E5E7EB;
        }

        * { box-sizing: border-box; }

        * {
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        body {
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: var(--text-main);
        }

        /* Mobile Device Mockup */
        .phone-mockup {
            position: relative;
            width: 414px;
            height: 896px;
            background: #1F1F1F;
            border-radius: 56px;
            padding: 12px;
            box-shadow: 0 0 0 2px #333, 0 20px 50px rgba(0, 0, 0, 0.2), 0 0 0 12px #111;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .buttons-left {
            position: absolute;
            left: -14px;
            top: 180px;
            width: 4px;
            height: 100px;
            background: #111;
            border-radius: 4px 0 0 4px;
        }

        .buttons-right {
            position: absolute;
            right: -14px;
            top: 200px;
            width: 4px;
            height: 80px;
            background: #111;
            border-radius: 0 4px 4px 0;
        }

        .status-bar {
            height: 44px;
            background-color: var(--primary);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 24px 0 32px;
            font-size: 14px;
            font-weight: 600;
            color: white;
            z-index: 101;
        }

        .status-icons {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .screen-content {
            width: 100%;
            height: 100%;
            background-color: var(--bg-light);
            border-radius: 44px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        @media (max-width: 500px) {
            body { background: var(--bg-light); display: block; }
            .phone-mockup { width: 100%; height: 100vh; padding: 0; border-radius: 0; box-shadow: none; background: none; display: block; }
            .screen-content { border-radius: 0; }
            .status-bar, .buttons-left, .buttons-right { display: none; }
        }

        .app-bar {
            background-color: var(--primary);
            color: white;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 16px;
            font-size: 17px;
            font-weight: 500;
            z-index: 10;
            position: relative;
            flex-shrink: 0;
        }

        .app-bar .back-btn {
            position: absolute;
            left: 8px;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border-radius: 50%;
            transition: background 0.2s;
            text-decoration: none;
            color: white;
        }

        .app-bar .back-btn:active { background: rgba(255, 255, 255, 0.2); }

        .app-bar .title {
            text-align: center;
            font-size: 16px;
            font-weight: 600;
            padding: 0 44px;
            line-height: 1.2;
        }

        .content {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        ::-webkit-scrollbar { display: none; width: 0; height: 0; }

        /* ===== Dải chọn Đại vận ===== */
        .dv-tabs-container {
            background: #ffffff;
            border-bottom: 1px solid var(--border-color);
            padding: 12px 0 14px;
            z-index: 5;
            position: sticky;          /* nằm trong vùng cuộn, dính mép trên khi cuộn qua khối thông tin */
            top: 0;
        }

        .dv-tabs-container::after {
            content: "";
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            width: 32px;
            background: linear-gradient(to right, rgba(255, 255, 255, 0), rgba(255, 255, 255, 0.96));
            pointer-events: none;
            z-index: 10;
        }

        .dv-tabs-label {
            padding: 0 16px 6px 20px;  /* thụt vào thêm 4px so với các thẻ Đại vận */
            font-size: 15px;
            font-weight: 600;
            color: #475569;
        }

        .dv-tabs-scroll {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 4px 16px;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }

        .dv-pill {
            flex: 0 0 auto;
            min-width: 106px;
            padding: 9px 14px;
            border-radius: 14px;
            border: 1.5px solid #cbd5e1;
            background: #f8fafc;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            user-select: none;
        }

        .dv-pill:hover:not(.active) {
            background: #f0fdf4;
            border-color: var(--primary);
            box-shadow: 0 4px 12px rgba(22, 145, 114, 0.15);
            transform: translateY(-2px);
        }

        .dv-pill:active { transform: scale(0.96); }

        .dv-pill-index {
            display: block;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.4px;
            text-transform: uppercase;
            color: #475569;
        }

        .dv-pill-years {
            display: block;
            margin-top: 3px;
            font-size: 14px;
            font-weight: 800;
            color: #0f172a;
            line-height: 1.25;
        }

        .dv-pill-age {
            display: block;
            margin-top: 2px;
            font-size: 11.5px;
            color: #64748b;
            font-weight: 500;
        }

        .dv-pill.active {
            background: linear-gradient(180deg, #ffffff 0%, #edf7f3 100%);
            border: 2px solid var(--primary-dark);
            box-shadow: 0 6px 18px rgba(30, 107, 82, 0.18);
        }

        .dv-pill.active .dv-pill-index { color: var(--primary-dark); }
        .dv-pill.active .dv-pill-years { color: #064e3b; }

        /* ===== Thẻ tổng quan giai đoạn (đồng bộ với màn Nghề nghiệp kết quả) ===== */
        .dv-hero {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            padding: 22px 20px;
            margin: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            overflow: hidden;
        }

        .dv-hero-title {
            margin: 0 0 18px 0;
            text-align: center;
            font-size: 16px;
            font-weight: 800;
            color: #1e6b52;
            letter-spacing: 0.6px;
        }

        .dv-hero-period-wrap {
            margin: 0 0 20px 0;
            display: flex;
            gap: 48px;
            flex-wrap: wrap;
        }

        .dv-hero-info-label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: 600;
            color: #64748b;
        }

        .dv-hero-info-icon {
            font-size: 14px;
            line-height: 1;
        }

        .dv-hero-info-value {
            font-size: 20px;
            font-weight: 700;
            color: #0f172a;
            letter-spacing: -0.3px;
            line-height: 1.3;
            margin-top: 6px;
        }

        .dv-hero-badges {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .dv-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 13px;
            font-weight: 700;
            padding: 5px 12px;
            border-radius: 16px;
        }

        .dv-badge-score {
            background: #fef3c7;
            color: #b45309;
        }

        .dv-badge-eval {
            background: #e6f4ef;
            color: #1e6b52;
        }

        /* ===== Các mục nội dung ===== */
        .dv-section {
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 16px;
            margin: 0 16px 14px;
            overflow: hidden;
        }

        .dv-section-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 16px;
            background: #F8FAFC;
            border-bottom: 1px solid var(--border-color);
        }

        .dv-section-icon {
            font-size: 18px;
            line-height: 1;
        }

        .dv-section-title {
            font-size: 15.5px;
            font-weight: 800;
            color: #1B5E43;
            letter-spacing: -0.2px;
        }

        .dv-section-body {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .dv-paragraph {
            margin: 0;
            font-size: 15px;
            line-height: 1.4;
            color: #1f2937;
        }

        .dv-list {
            margin: 0;
            padding-left: 0;
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
            font-size: 15px;
            line-height: 1.4;
            color: #334155;
        }

        .dv-list li {
            position: relative;
            padding-left: 20px;
        }

        .dv-list li::before {
            content: "";
            position: absolute;
            left: 5px;
            top: 8px;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--primary);
        }

        .dv-section-conclusion .dv-section-header {
            background: linear-gradient(135deg, #ECFDF5 0%, #D1FAE5 100%);
            border-bottom: 1px solid #A7F3D0;
        }

        .dv-placeholder {
            margin: 0;
            font-size: 14px;
            line-height: 1.4;
            color: #94a3b8;
            font-style: italic;
        }

        /* Điều hướng giai đoạn trước/sau */
        .dv-nav {
            display: flex;
            gap: 10px;
            margin: 4px 16px 24px;
        }

        .dv-nav-btn {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 12px;
            border-radius: 14px;
            border: 1px solid var(--border-color);
            background: #ffffff;
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            color: var(--primary-dark);
            cursor: pointer;
        }

        .dv-nav-btn:active { transform: scale(0.98); }

        .dv-nav-btn[disabled] {
            opacity: 0.4;
            cursor: default;
        }

        /* ===== Thẻ nhắc bổ sung câu hỏi (lá số chưa trả lời đủ) ===== */
        .dv-ask {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 16px 16px 12px;
            padding: 14px 14px 14px 16px;
            border-radius: 16px;
            background: linear-gradient(135deg, #FFFBEB 0%, #FEF3C7 100%);
            border: 1px solid #FDE68A;
        }

        .dv-ask-icon {
            width: 38px;
            height: 38px;
            flex-shrink: 0;
            border-radius: 12px;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 19px;
            box-shadow: 0 2px 6px rgba(180, 83, 9, 0.12);
        }

        .dv-ask-text { flex: 1; min-width: 0; }

        .dv-ask-title {
            font-size: 14.5px;
            font-weight: 700;
            color: #92400E;
            line-height: 1.35;
        }

        .dv-ask-sub {
            margin-top: 3px;
            font-size: 12.5px;
            color: #A16207;
            line-height: 1.4;
        }

        .dv-ask-btn {
            flex-shrink: 0;
            font-family: inherit;
            border: none;
            border-radius: 18px;
            padding: 8px 14px;
            background: var(--primary-dark);
            color: #ffffff;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }

        .dv-ask-btn:active { transform: scale(0.96); }

        /* ===== Thẻ "Thông tin công việc của bạn" (đầu trang, khi đã trả lời câu bắt buộc) ===== */
        .dv-personal {
            position: relative;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin: 16px 16px 12px;
            padding: 12px;
            border-radius: 16px;
            background: #EAF7F1;
            border: 1px solid #CDEBDD;
        }

        /* icon không khung nền, chỉ nét màu xanh */
        .dv-personal-icon {
            flex-shrink: 0;
            display: flex;
            color: var(--primary);
            margin-top: -2px;          /* canh giữa theo dòng tiêu đề */
        }

        .dv-personal-icon svg { width: 22px; height: 22px; }

        .dv-personal-body { flex: 1; min-width: 0; }

        .dv-personal-title {
            font-size: 14.5px;
            font-weight: 700;
            line-height: 1.35;
            color: #0F172A;
        }

        /* mỗi câu trả lời 1 dòng, dài thì cắt "…" */
        .dv-personal-line {
            margin-top: 2px;
            font-size: 13px;
            line-height: 1.4;
            color: #64748B;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* nhãn đầu dòng: Công việc / Chức vụ / Mục tiêu */
        .dv-personal-k {
            font-weight: 600;
            color: #334155;
        }

        /* tiêu đề + công việc nằm ngang hàng nút Sửa -> chừa chỗ; các dòng dưới dùng hết chiều ngang */
        .dv-personal-title,
        .dv-personal-job { padding-right: 76px; }

        .dv-personal-edit {
            position: absolute;
            top: 12px;
            right: 12px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 6px 12px;
            border-radius: 16px;
            border: 1px solid #CDEBDD;
            background: #ffffff;
            font-family: inherit;
            font-size: 13px;
            font-weight: 700;
            color: var(--primary-dark);
            cursor: pointer;
        }

        .dv-personal-edit:active { transform: scale(0.96); }

        /* Trạng thái đang cập nhật luận giải sau khi trả lời */
        .dv-loading {
            margin: 0 16px 14px;
            padding: 32px 16px;
            border-radius: 16px;
            background: #ffffff;
            border: 1px solid var(--border-color);
            text-align: center;
            font-size: 14px;
            font-weight: 600;
            color: #475569;
        }

        .dv-spinner {
            width: 28px;
            height: 28px;
            margin: 0 auto 12px;
            border-radius: 50%;
            border: 3px solid #D1FAE5;
            border-top-color: var(--primary);
            animation: dvSpin 0.8s linear infinite;
        }

        @keyframes dvSpin { to { transform: rotate(360deg); } }

        /* ===== Bottom sheet câu hỏi ===== */
        .qs-backdrop {
            position: absolute;
            inset: 0;
            background: rgba(15, 23, 42, 0.45);
            z-index: 50;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .qs-backdrop.show {
            opacity: 1;
            pointer-events: auto;
        }

        .qs-sheet {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            max-height: 88%;
            display: flex;
            flex-direction: column;
            background: #ffffff;
            border-radius: 24px 24px 0 0;
            box-shadow: 0 -8px 30px rgba(0, 0, 0, 0.15);
            z-index: 51;
            transform: translateY(100%);
            transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .qs-sheet.show { transform: translateY(0); }

        .qs-handle {
            width: 40px;
            height: 4px;
            margin: 10px auto 0;
            border-radius: 2px;
            background: #CBD5E1;
            flex-shrink: 0;
        }

        .qs-header {
            position: relative;
            flex-shrink: 0;
            padding: 12px 20px 14px;
            border-bottom: 1px solid #F1F5F9;
        }

        .qs-title {
            margin: 0;
            padding: 0 32px;           /* chừa đều 2 bên cho nút đóng để tiêu đề nằm đúng giữa */
            text-align: center;
            font-size: 18px;
            font-weight: 800;
            color: #0F172A;
            line-height: 1.3;
            letter-spacing: -0.2px;
            white-space: nowrap;       /* tiêu đề luôn trên 1 dòng */
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* màn hẹp: thu nhỏ chữ để tiêu đề vẫn vừa 1 dòng */
        @media (max-width: 380px) {
            .qs-title { font-size: 16px; }
        }

        .qs-desc {
            margin: 12px 0 0;          /* tách khỏi nút đóng (X) phía trên */
            font-size: 14.5px;
            line-height: 1.45;
            color: var(--text-main);
            text-align: left;
        }

        .qs-close {
            position: absolute;
            top: 6px;
            right: 14px;
            width: 34px;
            height: 34px;
            border: none;
            border-radius: 50%;
            background: #F1F5F9;
            color: #475569;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .qs-body {
            flex: 1;
            overflow-y: auto;
            padding: 4px 20px 8px;
        }

        .qs-item {
            display: flex;
            gap: 12px;
            padding: 14px 0;
        }

        .qs-icon {
            width: 30px;
            height: 30px;
            flex-shrink: 0;
            border-radius: 8px;
            background: #FEF3E2;
            color: #B45309;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .qs-icon svg { width: 16px; height: 16px; }

        .qs-main { flex: 1; min-width: 0; }

        .qs-label {
            display: block;
            font-size: 15px;
            font-weight: 700;
            color: #1F2937;
            line-height: 1.4;
        }

        .qs-required { color: #EF4444; }

        .qs-sub {
            margin: 3px 0 0;
            font-size: 14px;
            line-height: 1.45;
            color: #64748B;
        }

        /* Ô nhập câu trả lời (input 1 dòng / textarea 3 dòng) */
        .qs-field {
            display: block;
            width: 100%;
            margin-top: 10px;
            padding: 12px 14px;
            border: 1.5px solid var(--border-color);
            border-radius: 12px;
            background: #ffffff;
            font-family: inherit;
            font-size: 16px;           /* >= 16px để iOS không tự phóng to khi nhập */
            line-height: 1.45;
            color: #0F172A;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .qs-field::placeholder { color: #94A3B8; }

        .qs-field:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(22, 145, 114, 0.12);
        }

        /* Bấm CTA khi chưa nhập câu bắt buộc */
        .qs-field.invalid {
            border-color: #F87171;
            background: #FFFBFB;
        }

        .qs-field.invalid:focus { box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.12); }

        .qs-error {
            margin: 6px 0 0;
            font-size: 13px;
            line-height: 1.4;
            color: #DC2626;
        }

        .qs-textarea {
            resize: none;
            padding-bottom: 30px;      /* chừa chỗ cho bộ đếm ký tự */
        }

        .qs-textarea.no-count { padding-bottom: 12px; }   /* ô không hiện bộ đếm */

        #qsField-duty { line-height: 1.4; }   /* câu 2 */

        .qs-field-wrap { position: relative; }

        .qs-count {
            position: absolute;
            right: 12px;
            bottom: 8px;
            font-size: 12px;
            color: #94A3B8;
            pointer-events: none;
        }

        .qs-count.full {
            color: #D97706;
            font-weight: 600;
        }

        .qs-footer {
            flex-shrink: 0;
            padding: 12px 20px 18px;
            border-top: 1px solid #F1F5F9;
            background: #ffffff;
        }

        .qs-submit {
            width: 100%;
            height: 50px;
            border: none;
            border-radius: 25px;
            background: linear-gradient(135deg, #1FB08A 0%, #0F6B54 100%);
            color: #ffffff;
            font-family: inherit;
            font-size: 15.5px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 6px 16px rgba(15, 107, 84, 0.24);
        }

        .qs-submit:active { transform: scale(0.98); }

        /* ===== Toast ===== */
        .toast {
            position: absolute;
            left: 50%;
            bottom: 34px;
            width: 86%;
            transform: translateX(-50%) translateY(110px);
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 18px;
            border-radius: 20px;
            background: rgba(31, 41, 55, 0.95);
            color: #ffffff;
            font-size: 13.5px;
            font-weight: 500;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
            opacity: 0;
            pointer-events: none;
            z-index: 60;
            transition: transform 0.45s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .toast svg {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
            color: #6EE7B7;
        }
    </style>
</head>

<body>
    <div class="phone-mockup">
        <div class="buttons-left"></div>
        <div class="buttons-right"></div>
        <div class="screen-content">
            <div class="status-bar">
                <div class="time">19:45</div>
                <div class="status-icons">
                    <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor">

            var prev = VISIBLE[pos - 1], next = VISIBLE[pos + 1];

            var body = isUpdating
                ? '<div class="dv-loading"><div class="dv-spinner"></div>Đang cập nhật luận giải theo thông tin của bạn…</div>'
                : sections + conclusion;

            // khối thông tin công việc nằm riêng, phía trên dải chọn Đại vận
            document.getElementById('dvAnswerCard').innerHTML = renderAnswerCard();

            document.getElementById('dvContent').innerHTML =
                '<div class="dv-hero">' +
                    '<h2 class="dv-hero-title">' + esc(d.tag) + ': ĐẠI VẬN ' + (idx + 1) + '</h2>' +
                    '<div class="dv-hero-period-wrap">' +
                        '<div class="dv-hero-info-item">' +
                            '<div class="dv-hero-info-label"><span class="dv-hero-info-icon">📅</span>Giai đoạn từ năm</div>' +
                            '<div class="dv-hero-info-value">' + esc(d.years) + '</div>' +
                        '</div>' +
                        '<div class="dv-hero-info-item">' +
                            '<div class="dv-hero-info-label"><span class="dv-hero-info-icon">👤</span>Độ tuổi</div>' +
                            '<div class="dv-hero-info-value">' + esc(d.age) + '</div>' +
                        '</div>' +
                        (d.cung
                            ? '<div class="dv-hero-info-item">' +
                                  '<div class="dv-hero-info-label"><span class="dv-hero-info-icon">🏠</span>Cung</div>' +
                                  '<div class="dv-hero-info-value">' + esc(d.cung) + '</div>' +
                              '</div>'
                            : '') +
                    '</div>' +
                    '<div class="dv-hero-badges">' +
                        '<span class="dv-badge dv-badge-score">' +
                            '<svg viewBox="0 0 24 24" width="14" height="14" fill="#d97706"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>' +
                            '<span>' + esc(d.score) + '</span>' +
                        '</span>' +
                        '<span class="dv-badge dv-badge-eval">' +
                            '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>' +
                            '<span>' + esc(d.eval) + '</span>' +
                        '</span>' +
                    '</div>' +
                '</div>' +
                body +
                '<div class="dv-nav">' +
                    '<button class="dv-nav-btn" type="button" onclick="goTo(' + prev + ')"' + (prev === undefined ? ' disabled' : '') + '>‹ Giai đoạn trước</button>' +
                    '<button class="dv-nav-btn" type="button" onclick="goTo(' + next + ')"' + (next === undefined ? ' disabled' : '') + '>Giai đoạn sau ›</button>' +
                '</div>';
            document.getElementById('dvScroll').scrollTop = 0;
        }

        function goTo(i) {
            if (VISIBLE.indexOf(i) === -1) return;
            history.replaceState(null, '', 'tuvi_daivan_detail.html?dv=' + (i + 1));
            render(i);
        }

        function render(idx) {
            renderTabs(idx);
            renderContent(idx);
        }

        /* ===== Câu hỏi bổ sung cho lá số: trả lời đủ thì luận giải Đại vận chi tiết, cụ thể hơn ===== */
        // icon: nét vẽ SVG 24x24 (icon câu 1 dùng lại cho thẻ "Thông tin công việc của bạn" đầu trang)
        var QUESTIONS = [
            {
                key: 'job', label: 'Công việc', title: 'Công việc hiện tại của bạn là gì?', required: true,
                multiline: true, rows: 2, maxLength: 100, hideCount: true,
                error: 'Vui lòng nhập công việc hiện tại của bạn.',                placeholder: 'Ví dụ: Kế toán, nhân viên bán hàng, sinh viên...',
                icon: '<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M3 13h18"/><path d="M12 12v2"/>'
            },
            {
                key: 'duty', label: 'Chức vụ', title: 'Chức vụ hiện tại và công việc chính bạn đang phụ trách là gì?', multiline: true, maxWords: 50, hideCount: true,                placeholder: 'Ví dụ: Tôi là trưởng nhóm kinh doanh, phụ trách 5 nhân viên và theo dõi doanh số của nhóm.',
                icon: '<circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/>'
            },
            {
                key: 'goal', label: 'Mục tiêu', title: 'Mục tiêu công việc của bạn trong thời gian tới là gì?', multiline: true, maxWords: 100,                placeholder: 'Ví dụ: Tăng thu nhập, lên vị trí quản lý, chuyển sang lĩnh vực phù hợp hơn, mở doanh nghiệp...',
                icon: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/><path d="M13 11l6-6"/><path d="M17 3h4v4"/>'
            }
        ];

        // Câu trả lời gắn với từng lá số (theo ngày + giờ sinh)
        function answersKey() {
            var dob = '', tob = '';
            try {
                dob = localStorage.getItem('user_career_dob') || '';
                tob = localStorage.getItem('user_career_tob') || '';
            } catch (e) {}
            return 'laso_answers_' + dob + '_' + tob;
        }

        function loadAnswers() {
            var a = null;
            try { a = JSON.parse(localStorage.getItem(answersKey())); } catch (e) {}
            return a || {};
        }

        function saveAnswers(a) {
            try { localStorage.setItem(answersKey(), JSON.stringify(a)); } catch (e) {
                console.warn('Không ghi được localStorage:', e);
            }
        }

        function isAnswered(a, q) {
            return !!(a[q.key] && String(a[q.key]).trim());
        }

        function missingQuestions(a) {
            return QUESTIONS.filter(function (q) { return !isAnswered(a, q); });
        }

        // chỉ các câu bắt buộc: quyết định có tự bung sheet / hiện luận giải chi tiết hay không
        function missingRequired(a) {
            return missingQuestions(a).filter(function (q) { return q.required; });
        }

        /* Thẻ dưới hero: chưa đủ -> nhắc trả lời; đủ rồi -> tóm tắt thông tin đang dùng để luận giải */
        function renderAnswerCard() {
            if (missingRequired(answers).length) {
                var miss = missingQuestions(answers);
                return '<div class="dv-ask">' +
                    '<span class="dv-ask-icon">✍️</span>' +
                    '<div class="dv-ask-text">' +
                        '<div class="dv-ask-title">Luận giải đang ở mức tổng quát</div>' +
                        '<div class="dv-ask-sub">Trả lời thêm ' + miss.length + ' câu hỏi để xem công việc, tài chính sát với bạn hơn</div>' +
                    '</div>' +
                    '<button class="dv-ask-btn" type="button" onclick="openSheet(\'missing\')">Trả lời</button>' +
                    '</div>';
            }

            // câu không bắt buộc chưa trả lời thì bỏ dòng đó
            return '<div class="dv-personal">' +
                '<span class="dv-personal-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
                    findQuestion('job').icon + '</svg></span>' +
                '<div class="dv-personal-body">' +
                    '<div class="dv-personal-title">Thông tin công việc của bạn</div>' +
                    '<div class="dv-personal-line dv-personal-job"><span class="dv-personal-k">Công việc:</span> ' + esc(answers.job) + '</div>' +
                    (isAnswered(answers, findQuestion('duty')) ? '<div class="dv-personal-line"><span class="dv-personal-k">Chức vụ:</span> ' + esc(answers.duty) + '</div>' : '') +
                    (isAnswered(answers, findQuestion('goal')) ? '<div class="dv-personal-line"><span class="dv-personal-k">Mục tiêu:</span> ' + esc(answers.goal) + '</div>' : '') +
                '</div>' +
                '<button class="dv-personal-edit" type="button" onclick="openSheet(\'all\')">' +
                    '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>' +
                    'Sửa</button>' +
                '</div>';
        }

        /* ----- Bottom sheet ----- */
        var sheetQuestions = [];
        var draft = {};
        var isUpdating = false;

        // mode 'missing': chỉ hỏi các câu còn thiếu | 'all': sửa lại toàn bộ câu trả lời
        function openSheet(mode) {
            sheetQuestions = mode === 'all' ? QUESTIONS : missingQuestions(answers);
            if (!sheetQuestions.length) return;
            draft = JSON.parse(JSON.stringify(answers));

            var qsBody = document.getElementById('qsBody');
            qsBody.innerHTML = sheetQuestions.map(function (q) {
                var attrs = ' id="qsField-' + q.key + '" placeholder="' + esc(q.placeholder) + '"' +
                    ' oninput="onAnswerInput(\'' + q.key + '\', this.value)"';
                var field = q.multiline
                    ? '<div class="qs-field-wrap">' +
                          '<textarea class="qs-field qs-textarea' + (q.hideCount ? ' no-count' : '') + '" rows="' + (q.rows || 3) + '"' +
                              (q.maxWords ? '' : ' maxlength="' + (q.maxLength || 300) + '"') + attrs + '></textarea>' +
                          (q.hideCount ? '' : '<span class="qs-count" id="qsCount-' + q.key + '"></span>') +
                      '</div>'
                    : '<input class="qs-field" type="text" maxlength="100"' + attrs + '>';
                return '<div class="qs-item">' +
                    '<span class="qs-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
                        q.icon + '</svg></span>' +
                    '<div class="qs-main">' +
                        '<label class="qs-label" for="qsField-' + q.key + '">' + esc(q.title) + (q.required ? ' <span class="qs-required">*</span>' : '') + '</label>' +
                        (q.desc ? '<p class="qs-sub">' + esc(q.desc) + '</p>' : '') +
                        field +
                        (q.required ? '<p class="qs-error" id="qsError-' + q.key + '" hidden>' + esc(q.error) + '</p>' : '') +
                    '</div>' +
                    '</div>';
            }).join('');
            // điền câu trả lời cũ qua .value để không phải escape dấu nháy
            sheetQuestions.forEach(function (q) {
                document.getElementById('qsField-' + q.key).value = draft[q.key] || '';
                updateCount(q.key);
            });
            qsBody.scrollTop = 0;

            document.getElementById('qsBackdrop').classList.add('show');
            document.getElementById('qsSheet').classList.add('show');
        }

        function closeSheet() {
            document.getElementById('qsBackdrop').classList.remove('show');
            document.getElementById('qsSheet').classList.remove('show');
        }

        function findQuestion(key) {
            return QUESTIONS.filter(function (q) { return q.key === key; })[0];
        }

        function onAnswerInput(key, value) {
            var q = findQuestion(key);
            // câu giới hạn theo số từ: gõ/dán quá thì cắt bỏ phần thừa
            if (q.maxWords && countWords(value) > q.maxWords) {
                value = limitWords(value, q.maxWords);
                document.getElementById('qsField-' + key).value = value;
            }
            draft[key] = value;
            updateCount(key);
            if (isAnswered(draft, q)) setError(key, false);
        }

        function countWords(text) {
            var words = String(text).trim().split(/\s+/);
            return words[0] ? words.length : 0;
        }

        // giữ nguyên văn bản tới hết từ thứ `max`
        function limitWords(text, max) {
            var m = text.match(new RegExp('^\\s*(\\S+\\s+){' + (max - 1) + '}\\S+'));
            return m ? m[0] : text;
        }

        // bộ đếm của ô nhập nhiều dòng: theo số từ (nếu có maxWords) hoặc số ký tự
        function updateCount(key) {
            var count = document.getElementById('qsCount-' + key);
            if (!count) return;
            var q = findQuestion(key);
            var field = document.getElementById('qsField-' + key);
            if (q.maxWords) {
                var n = countWords(field.value);
                count.textContent = n + '/' + q.maxWords + ' từ';
                count.classList.toggle('full', n >= q.maxWords);
            } else {
                count.textContent = field.value.length + '/' + field.maxLength;
            }
        }

        // bật/tắt trạng thái lỗi của một câu bắt buộc
        function setError(key, on) {
            var error = document.getElementById('qsError-' + key);
            if (!error) return;
            error.hidden = !on;
            document.getElementById('qsField-' + key).classList.toggle('invalid', on);
        }

        function submitAnswers() {
            // nút luôn bấm được: thiếu câu bắt buộc thì báo lỗi ngay tại ô đó
            var missing = sheetQuestions.filter(function (q) { return q.required && !isAnswered(draft, q); });
            if (missing.length) {
                missing.forEach(function (q) { setError(q.key, true); });
                var first = document.getElementById('qsField-' + missing[0].key);
                var qsBody = document.getElementById('qsBody');
                // chỉ cuộn vùng câu hỏi (scrollIntoView/focus mặc định cuộn cả khung màn hình -> sheet bị đẩy lên)
                qsBody.scrollTop += first.getBoundingClientRect().top - qsBody.getBoundingClientRect().top - 80;
                first.focus({ preventScroll: true });
                return;
            }

            QUESTIONS.forEach(function (q) {
                if (draft[q.key]) draft[q.key] = String(draft[q.key]).trim();
            });
            answers = draft;
            saveAnswers(answers);
            closeSheet();

            // giả lập gọi lại luận giải với thông tin mới
            isUpdating = true;
            renderContent(currentIndex());
            setTimeout(function () {
                isUpdating = false;
                renderContent(currentIndex());
                showToast('Đã cập nhật luận giải theo thông tin của bạn');
            }, 1200);
        }

        var toastTimer;
        function showToast(message) {
            var toast = document.getElementById('toast');
            document.getElementById('toastMsg').textContent = message;
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(function () { toast.classList.remove('show'); }, 3000);
        }

        /* Tham số demo: ?cauhoi=reset (xoá câu trả lời) | ?cauhoi=partial (đã trả lời một phần) */
        (function applyDemoParam() {
            var mode = new URLSearchParams(window.location.search).get('cauhoi');
            if (mode === 'reset') saveAnswers({});
            if (mode === 'partial') saveAnswers({ duty: 'Trưởng nhóm, phụ trách phân tích nghiệp vụ phần mềm.' });
        })();

        var answers = loadAnswers();

        render(currentIndex());

        // lá số chưa trả lời câu hỏi bắt buộc -> tự bung bottom sheet sau khi màn hình hiển thị xong
        if (missingRequired(answers).length) {
            setTimeout(function () { openSheet('missing'); }, 600);
        }

        // canh lại dải chọn sau khi font/layout ổn định
        window.addEventListener('load', function () { renderTabs(currentIndex()); });
    </script>
</body>

</html>
