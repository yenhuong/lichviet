<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Các mặt trong đời sống - Lịch Việt</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="design-system/components.css">
    <style>
        /* Screen CSS: tokens only (design-system/tokens.css). Raw values left on purpose:
           phone mockup chrome, sizes (width/height), absolute positions and inline artwork. */

        * { box-sizing: border-box; }

        body {
            /* Page backdrop outside the phone (mockup chrome) */
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: var(--font-family);
            color: var(--color-text-primary);
        }

        /* Phone mockup (chrome, same frame as tuvi_vanhan_ketqua.html) */
        .phone-mockup {
            width: 414px;
            height: 896px;
            background: #1F1F1F;
            border-radius: 56px;
            padding: 12px;
            box-shadow: 0 0 0 2px #333, 0 20px 50px rgba(0, 0, 0, 0.2), 0 0 0 12px #111;
        }

        .screen {
            width: 100%;
            height: 100%;
            background: var(--color-bg-surface);
            border-radius: 44px; /* phone chrome */
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .scroll { flex: 1; overflow-y: auto; scrollbar-width: none; }
        .scroll::-webkit-scrollbar { display: none; }

        /* new/VanHanNavBar */
        .new-vanhan-navbar {
            height: 97px;
            flex-shrink: 0;
            position: relative;
            background: var(--gradient-vanhan-navbar);
            color: var(--color-text-on-primary);
        }

        .status-bar {
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 var(--space-22) 0 var(--space-32);
        }

        .status-icons { display: flex; gap: var(--space-4); align-items: center; }

        .topbar-title {
            position: absolute;
            left: 0;
            right: 0;
            top: 58px;
            text-align: center;
        }

        .btn-back {
            position: absolute;
            left: 20px;
            top: 58px;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 2;  /* keep above the full-width title, which otherwise swallows the tap */
        }

        /* new/VanHanAspectTabs: horizontal scroller of new/VanHanAspectTab (Default | Active) */
        .new-vanhan-aspect-tabs {
            flex-shrink: 0;
            display: flex;
            gap: var(--space-8);
            padding: var(--space-12);
            overflow-x: auto;
            scrollbar-width: none;
            background: var(--color-vanhan-profile-bg);
            border-bottom: 1px solid var(--color-vanhan-profile-border);
        }

        .new-vanhan-aspect-tabs::-webkit-scrollbar { display: none; }

        .new-vanhan-aspect-tab {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: var(--space-10);
            height: 56px;
            padding: 0 var(--space-16) 0 var(--space-12);
            background: var(--color-bg-surface);
            border: 1px solid var(--color-border-card);
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow-vanhan-tab);
            cursor: pointer;
        }

        .new-vanhan-aspect-tab.active { background: var(--color-vanhan-bg); border-color: var(--color-vanhan-primary); }

        .tab-ic { width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; }
        .tab-ic img { max-width: 26px; max-height: 26px; }
        .tab-txt { display: flex; flex-direction: column; }
        .tab-name { color: var(--color-text-primary); white-space: nowrap; }
        .new-vanhan-aspect-tab.active .tab-name { color: var(--color-vanhan-primary); }
        .tab-sub { color: var(--color-text-secondary); white-space: nowrap; }

        /* Rating level text colors (this screen's palette, see hand-off notes) */
        .level-good { color: var(--color-vanhan-primary); }
        .level-mid { color: var(--color-primary); }
        .level-warn { color: var(--color-status-danger); }

        /* new/VanHanAspectHero */
        .new-vanhan-aspect-hero {
            position: relative;
            overflow: hidden;
            margin: var(--space-16) var(--space-12) 0;
            padding: var(--space-18) var(--space-16);
            background: var(--gradient-vanhan-hero);
            border: 1px solid var(--color-chip-success-border);
            border-radius: var(--radius-lg);
        }

        .hero-art { position: absolute; right: 0; bottom: 0; width: 96px; height: 70px; pointer-events: none; }
        .new-vanhan-aspect-hero > *:not(.hero-art) { position: relative; z-index: 1; }
        .hero-label { color: var(--color-vanhan-accent); }
        .hero-title { margin-top: var(--space-8); padding-right: 48px; /* keep clear of the artwork */ color: var(--color-vanhan-accent); text-transform: uppercase; }
        .hero-rating { margin-top: var(--space-10); display: flex; align-items: center; gap: var(--space-10); }

        /* new/VanHanLevelPill (good | mid | normal | bad) */
        .new-vanhan-level-pill { height: 28px; padding: 0 var(--space-12); border-radius: var(--radius-full); display: inline-flex; align-items: center; }
        .new-vanhan-level-pill.good { background: var(--color-chip-success-bg); color: var(--color-vanhan-primary); }
        .new-vanhan-level-pill.mid { background: var(--color-vanhan-info-bg); color: var(--color-primary); }
        .new-vanhan-level-pill.normal { background: var(--color-vanhan-caution-bg); color: var(--color-vanhan-caution); }
        .new-vanhan-level-pill.bad { background: var(--color-vanhan-danger-bg); color: var(--color-status-danger); }

        /* new/VanHanStarRating */
        .new-vanhan-stars { display: inline-flex; gap: var(--space-4); align-items: center; }
        .new-vanhan-stars img { display: block; }

        /* Sections */
        .sec { padding: var(--space-20) var(--space-16) 0; }
        .sec + .sec { margin-top: var(--space-20); border-top: 1px solid var(--color-border-divider); }
        .sec + .sec.sec-flush { margin-top: 0; border-top: none; }

        /* new/VanHanSectionTitle */
        .new-vanhan-section-title { display: flex; align-items: center; gap: var(--space-10); color: var(--color-text-primary); margin-bottom: var(--space-12); }
        .sec-ic { width: 32px; height: 32px; border-radius: var(--radius-full); background: var(--color-vanhan-primary); color: var(--color-text-on-primary); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .p { color: var(--color-text-body); margin: 0; }
        .body-g + .body-g { margin-top: var(--space-20); }
        .body-g .p + .p { margin-top: var(--space-4); }

        /* new/VanHanTrendStrip: 3 read-only new/VanHanTrendYear cells, current year tinted */
        .new-vanhan-trend-strip { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: var(--space-4); margin-bottom: var(--space-12); padding: var(--space-4); background: var(--color-bg-subtle); border: 1px solid var(--color-border-divider); border-radius: var(--radius-lg); }
        .new-vanhan-trend-year { padding: var(--space-10) var(--space-4); text-align: center; border-radius: var(--radius-sm); }
        .new-vanhan-trend-year.now { background: var(--color-vanhan-bg); }
        .tr-cap { color: var(--color-text-tertiary); margin-bottom: var(--space-2); }
        .new-vanhan-trend-year.now .tr-cap { color: var(--color-vanhan-primary); }
        .tr-year { color: var(--color-vanhan-text-muted); }
        .new-vanhan-trend-year.now .tr-year { color: var(--color-vanhan-primary); }
        .new-vanhan-trend-year .new-vanhan-stars { margin-top: var(--space-4); }
        .tr-lbl { margin-top: var(--space-4); }
        /* Single-line labels: keep them from wrapping when exported to Figma (font metrics differ) */
        .tr-cap, .tr-year, .tr-lbl, .new-vanhan-trend-verdict { white-space: nowrap; }

        /* new/VanHanTrendVerdict (up | same | down) */
        .new-vanhan-trend-verdict { display: inline-flex; align-items: center; gap: var(--space-8); height: 32px; padding: 0 var(--space-16) 0 var(--space-12); margin: 0 0 var(--space-12); border-radius: var(--radius-full); }
        .new-vanhan-trend-verdict svg { flex-shrink: 0; }
        .new-vanhan-trend-verdict.up { background: var(--color-chip-success-bg); color: var(--color-vanhan-primary); }
        .new-vanhan-trend-verdict.same { background: var(--color-vanhan-info-bg); color: var(--color-primary); }
        .new-vanhan-trend-verdict.down { background: var(--color-vanhan-danger-bg); color: var(--color-status-danger); }
        .next-yr { margin-top: var(--space-16); padding-top: var(--space-12); border-top: 1px dashed var(--color-border-divider); }
        .next-yr-t { display: flex; align-items: center; gap: var(--space-8); color: var(--color-text-primary); margin-bottom: var(--space-4); }
        .next-yr-t svg { width: 16px; height: 16px; color: var(--color-vanhan-primary); }

        /* Good / caution lists */
        .h3 { display: flex; align-items: center; gap: var(--space-8); margin: var(--space-16) 0 var(--space-8); }
        .h3.good { color: var(--color-vanhan-primary); }
        .h3.warn { color: var(--color-vanhan-caution); }
        .list { margin: 0; padding-left: var(--space-20); }
        .list li { color: var(--color-text-body); }
        .list li + li { margin-top: var(--space-4); }
        .list li::marker { color: var(--color-vanhan-primary); }

        /* new/VanHanAdviceCard */
        .sub-h { color: var(--color-text-primary); margin-bottom: var(--space-8); }
        .sub-h ~ .sub-h { margin-top: var(--space-16); }
        .new-vanhan-advice-card { background: var(--color-vanhan-bg); border: 1px solid var(--color-chip-success-border); border-radius: var(--radius-sm); padding: var(--space-12) var(--space-16); }
        .adv-t { color: var(--color-text-primary); }
        .adv-d { color: var(--color-text-primary); }
        .adv-t + .adv-d { margin-top: var(--space-8); }

        /* new/VanHanMonthTile: same surface for every month; month type shown only by the level pill */
        .when { display: flex; flex-direction: column; gap: var(--space-8); }
        .new-vanhan-month-tile { padding: var(--space-12) var(--space-16); border-radius: var(--radius-sm); border: 1px solid var(--color-chip-success-border); background: var(--color-vanhan-bg); cursor: pointer; }
        .new-vanhan-month-tile:active { background: var(--color-chip-success-bg); }
        .wt-head { display: flex; align-items: center; justify-content: space-between; gap: var(--space-8); }
        .wt-m { color: var(--color-vanhan-caution); }
        .wt-head .new-vanhan-level-pill { flex-shrink: 0; }
        .wt-s { margin-top: var(--space-2); color: var(--color-text-secondary); }
        .wt-n { margin-top: var(--space-8); color: var(--color-text-body); }
        .wt-link { margin-top: var(--space-16); padding-top: var(--space-12); border-top: 1px solid var(--color-border-divider); display: flex; align-items: center; justify-content: space-between; color: var(--color-vanhan-accent); text-decoration: none; cursor: pointer; }

        /* new/VanHanAccordion of new/VanHanAccordionItem (Closed | Open) */
        .new-vanhan-accordion { border: 1px solid var(--color-border-card); border-radius: var(--radius-sm); overflow: hidden; }
        .new-vanhan-accordion-item + .new-vanhan-accordion-item { border-top: 1px solid var(--color-border-card); }
        .qa-q { display: flex; align-items: center; gap: var(--space-10); padding: var(--space-12) var(--space-16); cursor: pointer; }
        .qa-q span { flex: 1; }
        .qa-q svg { transition: transform .2s; flex-shrink: 0; color: var(--color-vanhan-text-caption); }
        .new-vanhan-accordion-item.open .qa-q svg { transform: rotate(180deg); }
        .qa-a { display: none; padding: 0 var(--space-16) var(--space-12); color: var(--color-text-body); }
        .new-vanhan-accordion-item.open .qa-a { display: block; }

        /* "Other" tab: new/VanHanNotice + new/VanHanPalaceCard */
        .new-vanhan-notice { display: flex; gap: var(--space-10); align-items: flex-start; background: var(--color-vanhan-bg); border: 1px solid var(--color-chip-success-border); border-radius: var(--radius-sm); padding: var(--space-12) var(--space-16); }
        .palace-sub { color: var(--color-text-secondary); margin-top: calc(-1 * var(--space-4)); }
        .palace-body { margin-top: var(--space-12); }
        .pal-meta { display: flex; align-items: center; flex-wrap: wrap; gap: var(--space-6); color: var(--color-text-body); margin-bottom: var(--space-8); }
        .pal-ic { width: 32px; height: 32px; flex-shrink: 0; }
        .pal-list { margin-top: var(--space-8); }
        .pal-list .list li + li { margin-top: var(--space-8); }
        .pal-dot { color: var(--color-text-secondary); }
        .pal-sub-h { margin-top: var(--space-20); margin-bottom: 0; }
        .pal-sub-h + .when { margin-top: var(--space-8); }

        /* Explore more: new/VanHanSectionBand + Section Header + Card wrapping new/VanHanExploreGrid */
        .new-vanhan-section-band { margin-top: var(--space-32); height: 8px; background: var(--color-bg-muted); }
        .section-title { margin: var(--space-20) var(--space-12) var(--space-18); color: var(--color-text-primary); }
        .explore-card { margin: 0 var(--space-12); }
        .new-vanhan-explore-grid { display: grid; grid-template-columns: repeat(3, 1fr); row-gap: var(--space-16); padding: var(--space-16) 0; }
        .new-vanhan-explore-item { display: flex; flex-direction: column; align-items: center; gap: var(--space-12); text-align: center; color: var(--color-text-label); cursor: pointer; }
        .new-vanhan-explore-item img { width: 52px; height: 52px; display: block; }

        .bottom-space { height: 32px; }
    </style>
</head>

<body>
    <div class="phone-mockup">
        <div class="screen">
            <div class="new-vanhan-navbar" data-component="new/VanHanNavBar">
                <div class="status-bar text-status-time">
                    <span>9:41</span>
                    <span class="status-icons">
                        <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect x="0" y="7" width="3" height="4" rx="1"/><rect x="4.5" y="5" width="3" height="6" rx="1"/><rect x="9" y="2.5" width="3" height="8.5" rx="1"/><rect x="13.5" y="0" width="3" height="11" rx="1"/></svg>

    <script>
        // Level label + class per star count (same scale as the result screen)
        // c = text color class, p = new/VanHanLevelPill variant
        const LEVEL = {
            1: { t: 'Xấu', c: 'level-warn', p: 'bad' },
            2: { t: 'Không thuận lợi', c: 'level-warn', p: 'bad' },
            3: { t: 'Trung bình', c: 'level-mid', p: 'mid' },
            4: { t: 'Tốt', c: 'level-good', p: 'good' },
            5: { t: 'Rất tốt', c: 'level-good', p: 'good' }
        };

        // Content condensed from vanhan_KhachHang_2027.pdf (section 4, 6, 7)
        const ASPECTS = [
            {
                key: 'congviec', name: 'Công việc', icon: 'i_congviec.svg', stars: 3,
                title: 'Giữ nhịp, chờ thời cơ',
                trend: [1, 3, 3],
                compare: 'Từ năm 2026 sang 2027, công việc của bạn có bước chuyển rõ rệt, từ mức “Xấu” lên “Trung bình”. Những nỗ lực âm thầm năm trước nay đã bắt đầu đơm hoa, thời điểm đẹp để bạn mạnh dạn bước tới.',
                body: [
                    'Năm 2027, công việc của bạn có cả cơ hội lẫn trở ngại, hai mặt khá cân bằng.',
                    ['Theo các sao lưu niên đã nêu ở phần Luận Lưu niên, môi trường năm nay tác động đến từng mặt như sau. Môi trường năm nay mang lại cho công việc những điểm thuận lợi: năng lực được ghi nhận, thuận thi cử, bằng cấp, hồ sơ, được giới thiệu cơ hội việc làm, dự án qua quan hệ, nhiều dịp đi công tác, có thể đổi vị trí hoặc nơi làm.',
                    'Tuy nhiên, công việc cũng dễ gặp trở ngại. Kế hoạch dễ hụt, việc hứa hẹn không thành, dễ có việc gấp phải xử lý ngay, dễ bất đồng, công việc dễ vướng: thủ tục chậm, hiểu lầm với cấp trên hoặc đồng nghiệp.'],
                    ['Xét riêng cung Quan Lộc, <b>L. Lộc Tồn</b> nhập cung kết hợp với <b>ĐV. Lộc Tồn</b> từ tam hợp chiếu về, là dấu hiệu thuận lợi: công việc ổn định, làm chắc, ít thay đổi.',
                    'Dù vậy, <b>Tử Vi (miếu)</b> và <b>Thiên Khôi</b> trong cung gặp <b>ĐV. Thái Tuế</b> nhập cung, khiến công việc dễ phát sinh chuyện không như ý: dễ có tranh luận, thị phi nơi làm việc. Thêm vào đó, <b>Tử Vi (miếu)</b> và <b>Thiên Khôi</b> cùng <b>ĐV. Thiên Khốc</b> từ cung Phu Thê xung chiếu về, khiến dễ chán nản, áp lực tâm lý trong công việc. May mắn là cung Quan Lộc có Tử Vi (miếu) sáng, phần nào giúp giảm bớt mức độ bất lợi.'],
                    'Nhìn chung, công việc năm nay giữ được nhịp ổn định, nên làm chắc từng việc, tận dụng mặt thuận lợi và xử lý sớm khi có vướng mắc. Sự hỗ trợ từ người khác là có, song bạn vẫn cần chủ động tháo gỡ khó khăn, kiểm soát tiến độ và thận trọng trong các quyết định quan trọng.'
                ],

                        </div>`).join('')}
                    </div>
                    ${trendVerdict(a)}
                    <p class="p text-body-md-regular">${a.compare}</p>
                    <div class="next-yr">
                        <div class="next-yr-t text-body-md-semibold">${SEC_IC.next}Nhìn sang năm 2028</div>
                        <p class="p text-body-md-regular">${a.next}</p>
                    </div>
                </div>

                <div class="sec">
                    ${secTitle('how', `${a.name} năm nay thế nào?`)}
                    ${a.body ? bodyHTML(a.body) : `
                    <p class="p text-body-md-regular">${a.summary}</p>
                    <div class="h3 good text-body-md-semibold">${ICON_GOOD}Điểm thuận lợi</div>
                    ${list(a.good)}
                    <div class="h3 warn text-body-md-semibold">${ICON_WARN}Điều cần lưu ý</div>
                    ${list(a.warn)}`}
                </div>

                <div class="sec">
                    ${secTitle('advice', 'Bạn nên làm gì trong năm nay?')}
                    <div class="sub-h text-body-md-semibold">Lời khuyên dành cho bạn</div>
                    <div class="new-vanhan-advice-card" data-component="new/VanHanAdviceCard">
                        ${a.adviceTitle ? `<div class="adv-t text-title-sm">${a.adviceTitle}</div>` : ''}
                        <div class="adv-d text-body-md-regular">${a.advice}</div>
                    </div>
                    <div class="sub-h text-body-md-semibold">Thời điểm đáng chú ý</div>
                    ${whenHTML(a.when)}
                </div>`;

            if (a.extra) {
                h += `
                <div class="sec">
                    ${secTitle('extra', a.extra.title)}
                    <div class="new-vanhan-accordion" data-component="new/VanHanAccordion">${a.extra.qa.map(([q, ans], i) => `
                        <div class="new-vanhan-accordion-item ${i === 0 ? 'open' : ''}" data-component="new/VanHanAccordionItem">
                            <div class="qa-q text-body-md-semibold" onclick="this.parentElement.classList.toggle('open')"><span>${q}</span>${CHEVRON}</div>
                            <div class="qa-a text-body-md-regular">${ans}</div>
                        </div>`).join('')}
                    </div>
                </div>`;
            }

            return h;
        }

        // Notable months list (new/VanHanMonthTile)
        function whenHTML(items) {
            return `<div class="when">${items.map(w => `
                        <div class="new-vanhan-month-tile" data-component="new/VanHanMonthTile" onclick="goMonth('${w.m}')">
                                <div class="wt-head">
                                    <span class="wt-m text-title-sm">${w.m} âm lịch</span>
                                    ${levelPill(w.type, MONTH_TAG[w.type])}
                                </div>
                                ${w.solar ? `<div class="wt-s text-body-md-regular">${w.solar} dương lịch</div>` : ''}
                                <div class="wt-n text-body-md-regular">${w.note}</div>
                                <span class="wt-link text-body-md-semibold">Xem vận hạn ${w.m.toLowerCase()}<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></span>
                        </div>`).join('')}</div>`;
        }

        // Paragraph groups: a string is its own group, an array keeps related paragraphs close together
        function bodyHTML(body) {
            return body.map(g => `<div class="body-g">${[].concat(g).map(t => `<p class="p text-body-md-regular">${t}</p>`).join('')}</div>`).join('');
        }

        function renderOther(a) {
            return a.palaces.map(p => `
                <div class="sec">
                    <div class="new-vanhan-section-title text-title-md" data-component="new/VanHanSectionTitle"><img class="pal-ic" src="${IC}cung/${p.icon}" width="32" height="32" alt="">${p.name}</div>
                    ${p.moving
                        ? `<div class="pal-meta text-body-md-regular">${starsHTML(p.stars, 14)}<span class="text-body-md-semibold ${LEVEL[p.stars].c}">${LEVEL[p.stars].t}</span><span class="pal-dot">·</span><span>Mức biến động: <b>${p.volatility}</b></span></div>
                           <p class="p text-body-md-regular">${p.desc}</p>
                           <div class="sub-h pal-sub-h text-body-md-semibold">Vấn đề trong năm</div>`
                        : `<div class="palace-sub text-body-md-regular">${p.sub}</div>`}
                    ${p.moving ? `<div class="pal-list">${list(p.body.flat())}</div>` : `<div class="palace-body">${bodyHTML(p.body)}</div>`}
                    ${p.when && p.when.length ? `<div class="sub-h pal-sub-h text-body-md-semibold">Khi nào?</div>${whenHTML(p.when)}` : ''}
                </div>`).join('');
        }

        // Back to the previous screen; when opened directly (no in-app history), fall back to the result screen
        function goBack() {
            const fromSameSite = document.referrer && new URL(document.referrer).origin === location.origin;
            if (fromSameSite && history.length > 1) history.back();
            else window.location.href = 'tuvi_vanhan_ketqua.html';
        }

        // Open the monthly forecast for a lunar month label such as "Tháng 10"
        function goMonth(label) {
            const n = parseInt(label.replace(/\D/g, ''), 10);
            window.location.href = `tuvi_vanhan_thang.html?month=${n}`;
        }

        function selectTab(key) {
            const a = ASPECTS.find(x => x.key === key) || ASPECTS[0];
            renderTabs(a.key);
            document.getElementById('content').innerHTML = a.other ? renderOther(a) : renderAspect(a);
            document.getElementById('scroll').scrollTop = 0;
            const wrap = document.getElementById('tabs');
            const el = wrap.querySelector('.new-vanhan-aspect-tab.active');
            wrap.scrollLeft = el.offsetLeft - wrap.offsetLeft - (wrap.clientWidth - el.offsetWidth) / 2;
            history.replaceState(null, '', `?tab=${a.key}`);
        }

        selectTab(new URLSearchParams(location.search).get('tab') || 'congviec');
    </script>
</body>

</html>
